name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Dos sistemas para ver en acción @EnabledOnOs (Tema 6).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ejecutar todos los tests, incluidos los lentos
        run: mvn -B verify -Ptodos
      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-${{ matrix.os }}
          path: target/surefire-reports/
